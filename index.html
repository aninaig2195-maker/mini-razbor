<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f2ed"><title>Почему ты снова оказываешься в той же ситуации? | Нина Айзман</title><style>:root{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#29272b;background:#f7f2ed}*{box-sizing:border-box}body{margin:0}.wrap{max-width:680px;margin:0 auto;padding:22px 16px 55px}.brand{font-size:14px;font-weight:750;letter-spacing:.05em;color:#79665e;margin-bottom:22px}.card{background:white;border-radius:24px;padding:clamp(22px,5vw,42px);box-shadow:0 12px 40px #372a2212}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#936a60;font-weight:750}h1{font-size:clamp(27px,5vw,39px);line-height:1.17;letter-spacing:-.03em;margin:14px 0}h2{font-size:clamp(22px,4vw,29px);line-height:1.25;margin:14px 0 18px}h3{font-size:17px;margin:0 0 8px}p{line-height:1.6;color:#5a5355}button,a.cta{font:inherit;cursor:pointer}.btn{border:0;border-radius:12px;background:#8d514a;color:white;padding:15px 21px;font-weight:750;display:inline-flex;justify-content:center;align-items:center;text-decoration:none;min-height:49px}.btn:hover{background:#74413b}.btn:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#f0e9e5;color:#4d4240}.secondary:hover{background:#e8dcd6}.actions{display:flex;gap:10px;margin-top:25px}.actions .btn{flex:1}.choice{display:block;border:1.5px solid #e8e1de;border-radius:13px;padding:15px 16px;margin:10px 0;cursor:pointer;line-height:1.4}.choice:has(input:checked){border-color:#97564d;background:#fbf1ed}.choice input{accent-color:#97564d;margin-right:9px}.bar{height:7px;border-radius:8px;background:#f0e8e4;overflow:hidden;margin:20px 0 27px}.bar span{display:block;height:100%;background:#9e6a60;transition:width .2s}.meta{display:flex;justify-content:space-between;color:#8d7772;font-size:13px}.result{background:#faf6f3;border-radius:15px;padding:18px;margin:12px 0}.result small{display:block;color:#906d65;text-transform:uppercase;letter-spacing:.09em;font-weight:750;margin-bottom:7px}.result p{margin:0;color:#353033}.note{font-size:13px;color:#7c7475}.price{font-size:30px;color:#8d514a;font-weight:800}.hidden{display:none}.footer{font-size:12px;color:#827878;text-align:center;margin:20px 0}a{color:#8d514a}ul{line-height:1.7;padding-left:21px}@media(max-width:430px){.actions{flex-direction:column-reverse}.actions .btn{width:100%}}</style></head><body><div class="wrap"><div class="brand">НИНА АЙЗМАН · МИНИ-РАЗБОР</div><main class="card" id="app" aria-live="polite"></main><div class="footer">Ответы обрабатываются только в твоём браузере и никуда автоматически не отправляются.</div></div><script>
const questions=[
{q:'Что сейчас происходит в твоих отношениях?',a:['Я подозреваю измену, но не знаю правду','Муж снова нарушает обещания или договорённости','Я хочу уйти, но не решаюсь','После измены я не могу восстановить доверие','Я не понимаю, хочу остаться или уйти']},
{q:'Что ты точно знаешь?',a:['У меня есть конкретные факты','В основном подозрения и догадки','Факты есть, но я не понимаю их значения','Мне трудно отделить факты от чувств']},
{q:'Чего ты хочешь на самом деле?',a:['Разобраться, что происходит','Сохранить отношения, но изменить ситуацию','Принять решение, оставаться или уходить','Перестать жить в постоянной тревоге','Я пока сама не понимаю']},
{q:'Что больше всего мешает?',a:['Страх последствий и неизвестности','Чувство вины или ответственности за других','Надежда, что он изменится','Деньги, дети, жильё или другие обстоятельства','Меня тянет в противоположные стороны']},
{q:'Что ты уже пробовала?',a:['Много раз разговаривала с партнёром','Устанавливала границы и договаривалась','Пыталась изменить свои реакции','Пока не предпринимала конкретных действий']},
{q:'Что происходит после твоих попыток?',a:['Сначала лучше, потом всё повторяется','Практически ничего не меняется','Ситуация становится хуже','Есть устойчивые улучшения','Не могу оценить результат']},
{q:'Какой вопрос для тебя сейчас самый трудный?',a:['Почему я снова оказываюсь в этой ситуации?','Почему я понимаю, чего хочу, но не действую?','Как принять решение, о котором не пожалею?','С чего начать реальные изменения?','Как понять, где факты, а где мои страхи?']}
];
const barriers=[['Страх последствий','Возможно, ты понимаешь желаемый результат, но опасаешься последствий. Важно отличать реальные риски от предполагаемых.'],['Чувство вины','Стоит исследовать, какую ответственность ты берёшь на себя и какие обязательства действительно принадлежат тебе.'],['Надежда на изменения','Надежда может быть обоснованной. Важно проверить, подтверждаются ли обещания устойчивыми действиями.'],['Практические обстоятельства','Не все препятствия психологические. Деньги, жильё, дети и безопасность требуют конкретной оценки и плана.'],['Внутреннее противоречие','Возможно, у тебя одновременно есть важные, но противоположные желания. Стоит понять, что стоит за каждым из них.']];
let step=-1,answers=Array(7).fill(null);const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function answer(i){return questions[i].a[answers[i]]}function render(){window.scrollTo({top:0,behavior:'instant'});if(step===-1){app.innerHTML=`<div class="eyebrow">Бесплатно · 3–5 минут</div><h1>Почему ты снова оказываешься в той же ситуации?</h1><p>Семь вопросов помогут составить предварительную карту: <strong>что происходит сейчас, чего ты хочешь и что может мешать изменениям.</strong></p><p>Это не тест с диагнозом и не готовое решение. Здесь нет правильных и неправильных ответов.</p><button class="btn" id="start">Начать мини-разбор →</button>`;document.getElementById('start').onclick=()=>{step=0;render()};return}if(step<7){const q=questions[step];app.innerHTML=`<div class="meta"><span>Твоя карта ситуации</span><span>Вопрос ${step+1} из 7</span></div><div class="bar"><span style="width:${(step+1)/7*100}%"></span></div><h2>${esc(q.q)}</h2><div role="radiogroup" aria-label="${esc(q.q)}">${q.a.map((s,i)=>`<label class="choice"><input type="radio" name="ans" value="${i}" ${answers[step]===i?'checked':''}>${esc(s)}</label>`).join('')}</div><div class="actions"><button class="btn secondary" id="back">← Назад</button><button class="btn" id="next" ${answers[step]===null?'disabled':''}>${step===6?'Получить мою карту':'Продолжить →'}</button></div><p class="note">Ты можешь вернуться и изменить любой ответ.</p>`;app.querySelectorAll('input').forEach(el=>el.onchange=()=>{answers[step]=Number(el.value);document.getElementById('next').disabled=false});document.getElementById('back').onclick=()=>{step--;render()};document.getElementById('next').onclick=()=>{if(answers[step]===null)return;step++;render()};return}const [barTitle,barText]=barriers[answers[3]];app.innerHTML=`<div class="eyebrow">Твоя предварительная карта</div><h1>Теперь ситуация видна яснее</h1><p>Эта карта составлена из твоих ответов. Она помогает сформулировать вопросы, но не устанавливает причины происходящего.</p><div class="result"><small>Точка А · Что происходит</small><h3>${esc(answer(0))}</h3><p>Что известно: ${esc(answer(1))}.</p></div><div class="result"><small>Точка Б · Чего ты хочешь</small><h3>${esc(answer(2))}</h3></div><div class="result"><small>Возможное препятствие</small><h3>${esc(barTitle)}</h3><p>${esc(barText)}</p></div><div class="result"><small>Что ты уже пробовала</small><h3>${esc(answer(4))}</h3><p>Результат: ${esc(answer(5))}.</p></div><div class="result"><small>Твой главный открытый вопрос</small><h3>${esc(answer(6))}</h3></div><button class="btn secondary" id="copy">Скопировать мою карту</button><h2>Что делать дальше?</h2><p>Ты уже попробовала отделить факты, желаемый результат и возможные препятствия. Но увидеть трудность и понять, как с ней работать, не одно и то же.</p><p>На индивидуальной консультации мы разберём твою ситуацию, проверим предположения, определим желаемый результат и возможные дальнейшие шаги.</p><div class="result"><h3>Индивидуальная консультация</h3><p><span class="price">$100</span> · 60 минут · онлайн</p><p>Один конкретный запрос. Индивидуальный разбор. Возможные следующие шаги.</p><a class="btn cta" href="https://www.instagram.com/aizmanina/" target="_blank" rel="noopener noreferrer">Открыть мой Instagram →</a><p class="note">Если переписка не открылась, найди в Instagram <strong>@aizmanina</strong> и отправь слово «КОНСУЛЬТАЦИЯ».</p><button class="btn secondary" id="copybooking">Скопировать сообщение для записи</button></div><p class="note">Если есть угрозы, насилие или опасность, безопасность важнее прохождения теста или ожидания консультации. Обратись за экстренной помощью.</p><button class="btn secondary" id="restart">Пройти заново</button>`;document.getElementById('restart').onclick=()=>{answers=Array(7).fill(null);step=-1;render()};document.getElementById('copybooking').onclick=async()=>{const msg='Здравствуйте! Я прошла мини-разбор и хочу записаться на индивидуальную консультацию за $100.';try{await navigator.clipboard.writeText(msg)}catch(e){const t=document.createElement('textarea');t.value=msg;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}document.getElementById('copybooking').textContent='Сообщение скопировано ✓'};document.getElementById('copy').onclick=async()=>{const t=`МОЯ КАРТА СИТУАЦИИ\n\nТочка А: ${answer(0)}\nЧто я знаю: ${answer(1)}\nТочка Б: ${answer(2)}\nВозможное препятствие: ${barTitle}. ${barText}\nЧто я пробовала: ${answer(4)}\nРезультат: ${answer(5)}\nГлавный вопрос: ${answer(6)}\n\nПредварительный самоанализ, не диагноз.`;try{await navigator.clipboard.writeText(t);document.getElementById('copy').textContent='Скопировано ✓'}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();document.getElementById('copy').textContent='Скопировано ✓'}}}render();
</script></body></html>
